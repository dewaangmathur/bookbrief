services:
  - type: web
    name: bookbrief
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 900 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUMMARY_MODEL
        value: gpt-4o-mini
      - key: MAX_CHUNK_TOKENS
        value: 6000
      - key: MAX_CHAPTER_WORKERS
        value: 4
      - key: MAX_CHUNK_WORKERS
        value: 6
      - key: PRICE_INPUT_PER_M
        value: 0.15
      - key: PRICE_OUTPUT_PER_M
        value: 0.60